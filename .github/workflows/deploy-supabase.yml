# Déploie la base de données (migrations) et les edge functions sur Supabase.
#
# - À chaque fusion dans main : projet de TEST (brouillons inclus).
# - Projet de PRODUCTION (élèves) : seulement à la main, onglet Actions, « Déploiement Supabase », « Run workflow ».
#
# Secrets et variables nécessaires (Settings, Secrets and variables, Actions) : voir docs/installation-supabase.md.
name: Déploiement Supabase

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'content/**'
      - 'balance.json'
  workflow_dispatch:
    inputs:
      cible:
        description: 'Projet à déployer'
        type: choice
        options: [test, prod]
        default: test

concurrency:
  group: supabase-${{ github.event.inputs.cible || 'test' }}

jobs:
  deployer:
    runs-on: ubuntu-latest
    env:
      CIBLE: ${{ github.event.inputs.cible || 'test' }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJET: ${{ (github.event.inputs.cible || 'test') == 'prod' && vars.PROD_SUPABASE_PROJECT_REF || vars.TEST_SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ (github.event.inputs.cible || 'test') == 'prod' && secrets.PROD_SUPABASE_DB_PASSWORD || secrets.TEST_SUPABASE_DB_PASSWORD }}
    steps:
      - name: Configuration présente ?
        id: config
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJET" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::notice::Supabase n'est pas encore configuré pour « $CIBLE ». Voir docs/installation-supabase.md."
            echo "pret=non" >> "$GITHUB_OUTPUT"
          else
            echo "pret=oui" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.config.outputs.pret == 'oui'
      - uses: actions/setup-node@v5
        if: steps.config.outputs.pret == 'oui'
        with:
          node-version: 22
          cache: npm
      - name: Données du jeu
        if: steps.config.outputs.pret == 'oui'
        run: |
          npm ci
          npm run verifier
          if [ "$CIBLE" = "prod" ]; then npm run donnees; else npm run donnees -- --brouillons; fi
      - uses: supabase/setup-cli@v1
        if: steps.config.outputs.pret == 'oui'
        with:
          version: latest
      - name: Base de données
        if: steps.config.outputs.pret == 'oui'
        run: |
          supabase link --project-ref "$PROJET" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Edge functions
        if: steps.config.outputs.pret == 'oui'
        run: supabase functions deploy --project-ref "$PROJET" --use-api
